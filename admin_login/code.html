<style>
        .glass-panel {
            background: rgba(34, 34, 34, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(42, 42, 42, 0.8);
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.8);
        }

            border-color: #D4AF37;
            box-shadow: 0 0 0 1px #D4AF37;

<body class="bg-background text-on-background min-h-screen font-body-md relative overflow-hidden flex items-center justify-center">
<!-- Cinematic Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center absolute inset-0" data-alt="A sweeping, cinematic landscape photograph of ancient Cambodian temple ruins at dusk. The scene is shot with an ultra-wide angle lens, capturing deep charcoal shadows and striking golden hour highlights piercing through the stonework. The overall mood is mysterious, majestic, and high-end, utilizing a moody noir aesthetic with rich blacks and warm golden tones perfect for a premium photography gallery background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASP9mXGNcvSSZVxYnn6GInpnt5ta9KUKjx-_1MmVFoGrhrkg-o0FYxIdkKayCrXCOpU43COdaaRskJGhVXHxCnAnvVDm_uJBP43nOd83ja99f-4TkXpPXPdEBWcOt2mqbB6J0skfK3FY6NlUWg96WTkW3Q8z-1BNqW4Kpwg7-5BUFU5mkvi0utv8O3c2ogVwDvkY5X5rhqYJwmCqV3OXYTzDgMxMvFFwXJ9dyqyJRLVSH2EPtO9p983Q')"></div>
<div class="absolute inset-0 bg-background/80 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-background/50"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[480px] px-margin-mobile md:px-0">
<div class="glass-panel p-8 md:p-12 rounded-lg flex flex-col items-center">
<!-- Brand & Header -->
<div class="mb-12 text-center w-full">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-widest mb-2 uppercase">Tong An</h1>
<p class="font-body-md text-body-md text-on-surface-variant tracking-wider uppercase">Admin Access</p>
<div class="w-12 h-[1px] bg-primary/50 mx-auto mt-6"></div>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-6 flex flex-col" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase block" for="email">Email Address</label>
<div class="relative gold-border-focus rounded bg-surface-container-high border border-outline-variant transition-colors duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-transparent border-none text-on-surface focus:ring-0 pl-10 py-3 rounded font-body-md text-body-md placeholder-on-surface-variant/50" id="email" name="email" placeholder="admin@tongan.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase block" for="password">Password</label>
<div class="relative gold-border-focus rounded bg-surface-container-high border border-outline-variant transition-colors duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-transparent border-none text-on-surface focus:ring-0 pl-10 py-3 rounded font-body-md text-body-md placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between pt-2">
<label class="flex items-center space-x-2 cursor-pointer group">
<input class="form-checkbox bg-surface-container-high border-outline-variant text-primary focus:ring-primary rounded-sm w-4 h-4 transition-colors" type="checkbox"/>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-caption text-caption text-primary hover:text-primary-fixed transition-colors underline-offset-4 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-8 bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded hover:bg-primary-fixed transition-colors duration-300 flex items-center justify-center space-x-2" type="submit">
<span>Login to Dashboard</span>
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Back to Gallery -->
<div class="mt-8 pt-8 border-t border-outline-variant/30 w-full text-center">
<a class="inline-flex items-center space-x-2 font-caption text-caption text-on-surface-variant hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span>Return to Public Gallery</span>
</a>
</div>
</div>
<!-- Minimal Footer info -->
<div class="mt-8 text-center">
<p class="font-caption text-caption text-on-surface-variant/60">© 2024 Tong An Photography. All Rights Reserved.</p>
</div>
</main>
