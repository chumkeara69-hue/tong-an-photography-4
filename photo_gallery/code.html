<style>
        body {
            background-color: #0D0D0D;
            color: #e5e2e1;
        }
        .masonry-grid {
            column-count: 1;
            column-gap: 24px;
        }

            .masonry-grid {
                column-count: 2;
            }
        }
        @media (min-width: 1024px) {
            .masonry-grid {
                column-count: 3;
            }
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 24px;
        }
        .photo-card-inner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(13,13,13,0.9) 0%, rgba(13,13,13,0) 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .photo-card:hover .photo-card-inner::after {
            opacity: 1;
        }
        .photo-card:hover .photo-img {
            transform: scale(1.05);
        }
        .photo-overlay-content {
            opacity: 0;
            transform: translateY(10px);
